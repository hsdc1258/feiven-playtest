name: 버그 · 문제 제보
description: FEIVEN 플레이테스트에서 발생한 버그, 접속 문제, 튕김 등을 제보합니다.
title: "[버그] "
labels: ["bug", "playtest-r20.1"]
body:
  - type: markdown
    attributes:
      value: |
        제보 감사합니다. 작성 전에 확인해 주세요.
        - 점검·혼잡 공지: [Issues 상단 고정 글](https://github.com/hsdc1258/feiven-playtest/issues) 또는 [FEIVEN Discord](https://discord.gg/nrUy3g7gQ)
        - 안내 문서: https://github.com/hsdc1258/feiven-playtest#readme
        - **비밀번호, 로그인 인증정보, 이메일 등 개인정보는 절대 올리지 마세요.** 스크린샷에 포함되어 있으면 가려 주세요.
        - 보안 취약점은 공개 이슈 대신 Discord에서 운영자에게 DM으로 알려 주세요.

  - type: dropdown
    id: category
    attributes:
      label: 문제 유형
      options:
        - 설치 / 실행이 안 됨
        - 로그인 / 회원가입
        - 매칭 / 대기열 / 접속 끊김
        - 경기 중 버그 (조작, 스킬, 맵 등)
        - 성능 (프레임 저하, 렉, 튕김)
        - 음성 채팅
        - 밸런스 / 게임플레이 의견
        - 기타
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 설치파일 버전 / 해시
      description: "릴리스 이름(예 R20.1)과, 해시를 확인했다면 앞 8자리(예 fc4b5f18)."
      placeholder: "R20.1 / fc4b5f18"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 버전 · 빌드
      description: "시작 → `winver` 실행 결과. 이 게임은 Windows 10 1809(빌드 17763) 이상 64비트 전용입니다."
      placeholder: "Windows 11 23H2 (OS 빌드 22631.4317)"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: 그래픽카드 · 드라이버 버전
      placeholder: "RTX 3060 / GeForce 560.94"
    validations:
      required: true

  - type: input
    id: cpu_ram
    attributes:
      label: CPU · 메모리 (선택)
      placeholder: "i5-12400F / 16GB"

  - type: input
    id: time
    attributes:
      label: 발생 시각 (KST)
      description: 서버 기록과 대조하는 데 필요합니다. 대략적이어도 됩니다.
      placeholder: "2026-09-20 21:15 KST"
    validations:
      required: true

  - type: input
    id: nickname
    attributes:
      label: 게임 내 닉네임 (선택)
      description: 경기 기록을 찾는 데 도움이 됩니다. 이메일이나 비밀번호는 적지 마세요.

  - type: input
    id: network
    attributes:
      label: 접속 환경 (선택)
      placeholder: "집 / PC방 / 회사 / 모바일 핫스팟"

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 어떤 화면에서 무엇을 눌렀을 때 생겼는지 순서대로 적어 주세요.
      placeholder: |
        1. 계정 메뉴에서 기존 계정 로그인 클릭
        2. 브라우저에서 로그인 후 게임으로 복귀
        3. 어둠의 성채 선택 → 준비
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 기대한 동작 / 실제 동작
      placeholder: |
        기대: 대기열에 들어가고 자리가 나면 입장
        실제: "..." 메시지가 뜨고 로비로 돌아감
    validations:
      required: true

  - type: input
    id: frequency
    attributes:
      label: 재현 빈도
      placeholder: "항상 / 가끔(3번 중 1번) / 한 번만"

  - type: textarea
    id: logs
    attributes:
      label: 로그 · 스크린샷
      description: |
        `%LOCALAPPDATA%\GroundedPVP\Saved\Logs` 폴더가 있으면 최신 로그 파일을 이 칸에 끌어다 놓아 첨부해 주세요. 이 빌드는 보통 로그를 남기지 않으므로 폴더가 없어도 괜찮습니다.
        게임 내 오류 메시지가 있었다면 그대로 옮겨 적어 주세요.

  - type: checkboxes
    id: confirm
    attributes:
      label: 확인
      options:
        - label: R20.1 설치파일(해시 fc4b5f18…)을 사용하고 있습니다. R19 이하가 아닙니다.
          required: true
        - label: 비밀번호·로그인 인증정보·개인정보를 포함하지 않았습니다.
          required: true
        - label: Issues 고정 글에서 점검·혼잡 안내를 확인했습니다.
